<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mergington High School Activities</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg" />
</head>

<body>
  <header>
    <h1>Mergington High School</h1>
    <h2>Extracurricular Activities</h2>
    <div id="user-controls">
      <div id="user-status">
        <button id="login-button" class="icon-button">
          <span class="user-icon">👤</span>
          <span>Login</span>
        </button>
        <div id="user-info" class="hidden">
          <button id="manage-announcements-button" class="header-action-button" aria-label="Manage announcements">
            <span aria-hidden="true">📣</span>
            <span>Announcements</span>
          </button>
          <span id="display-name"></span>
          <button id="logout-button">Logout</button>
        </div>
      </div>
    </div>
  </header>
  <div id="announcements" class="announcements hidden" aria-live="polite">
  </div>
  <main>
    <section id="activities-container">
      <div class="main-content-layout">
        <!-- Left Sidebar for Filters -->
        <aside class="sidebar-filters">
          <h3>Filter Activities</h3>
          <!-- Search Box -->
          <div class="search-box">
            <input type="text" id="activity-search" placeholder="Search activities..." />
            <button id="search-button" aria-label="Search">
              <span class="search-icon">🔍</span>
            </button>
          </div>

          <div class="filter-container">
            <div class="filter-label">Filter by category:</div>
            <div class="category-filters" id="category-filters">
              <button class="category-filter active" data-category="all">All</button>
              <button class="category-filter" data-category="sports">Sports</button>
              <button class="category-filter" data-category="arts">Arts</button>
              <button class="category-filter" data-category="academic">Academic</button>
              <button class="category-filter" data-category="community">Community</button>
              <button class="category-filter" data-category="technology">Technology</button>
            </div>
          </div>

          <!-- Day Filter -->
          <div class="filter-container day-filter-container">
            <div class="filter-label">Filter by day:</div>
            <div class="day-filters" id="day-filters">
              <button class="day-filter active" data-day="">All Days</button>
              <button class="day-filter" data-day="Monday">Monday</button>
              <button class="day-filter" data-day="Tuesday">Tuesday</button>
              <button class="day-filter" data-day="Wednesday">Wednesday</button>
              <button class="day-filter" data-day="Thursday">Thursday</button>
              <button class="day-filter" data-day="Friday">Friday</button>
              <button class="day-filter" data-day="Saturday">Saturday</button>
              <button class="day-filter" data-day="Sunday">Sunday</button>
            </div>
          </div>

          <!-- Time Filter -->
          <div class="filter-container time-filter-container">
            <div class="filter-label">Filter by time:</div>
            <div class="time-filters">
              <button class="time-filter active" data-time="">All Times</button>
              <button class="time-filter" data-time="morning">Before School</button>
              <button class="time-filter" data-time="afternoon">After School</button>
              <button class="time-filter" data-time="weekend">Weekend</button>
            </div>
          </div>
        </aside>

        <!-- Activities Content -->
        <div class="activities-content">
          <div id="activities-list">
            <!-- Activities will be loaded here -->
            <p>Loading activities...</p>
          </div>
          <div id="message" class="hidden message"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Mergington High School</p>
  </footer>

  <!-- Registration Modal -->
  <div id="registration-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>Register for <span id="modal-activity-name"></span></h3>
      <form id="signup-form">
        <div class="form-group">
          <label for="email">Student Email:</label>
          <input type="email" id="email" required placeholder="your-email@mergington.edu" />
        </div>
        <input type="hidden" id="activity" value="" />
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-login-modal">&times;</span>
      <h3>Teacher Login</h3>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" required placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required placeholder="Enter your password" />
        </div>
        <button type="submit">Login</button>
      </form>
      <div id="login-message" class="hidden message"></div>
    </div>
  </div>

  <dialog id="announcement-dialog" class="announcement-dialog" aria-labelledby="announcement-dialog-title">
    <div class="announcement-dialog-header">
      <div>
        <p class="dialog-eyebrow">School communications</p>
        <h3 id="announcement-dialog-title">Manage announcements</h3>
      </div>
      <button id="close-announcement-dialog" class="dialog-close-button" type="button" aria-label="Close announcement manager">&times;</button>
    </div>
    <div class="announcement-manager-layout">
      <section class="announcement-editor" aria-labelledby="announcement-form-title">
        <h4 id="announcement-form-title">Add announcement</h4>
        <form id="announcement-form">
          <input id="announcement-id" type="hidden" />
          <div class="form-group">
            <label for="announcement-message">Message</label>
            <textarea id="announcement-message" rows="4" maxlength="500" required placeholder="What should the school community know?"></textarea>
          </div>
          <div class="announcement-date-fields">
            <div class="form-group">
              <label for="announcement-start-date">Start date <span>(optional)</span></label>
              <input id="announcement-start-date" type="date" />
            </div>
            <div class="form-group">
              <label for="announcement-expiration-date">Expiration date</label>
              <input id="announcement-expiration-date" type="date" required />
            </div>
          </div>
          <div id="announcement-form-message" class="form-message hidden" role="status"></div>
          <div class="announcement-form-actions">
            <button id="cancel-announcement-edit" class="secondary-button hidden" type="button">Cancel edit</button>
            <button id="save-announcement" type="submit">Add announcement</button>
          </div>
        </form>
      </section>
      <section class="announcement-library" aria-labelledby="announcement-list-title">
        <div class="announcement-library-heading">
          <h4 id="announcement-list-title">Existing announcements</h4>
          <span id="announcement-count" class="announcement-count"></span>
        </div>
        <div id="announcement-list" class="announcement-list"></div>
      </section>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>

</html>
